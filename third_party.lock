# Pinned third-party sources for moonlight-tsp. Fetched by
# scripts/fetch-third-party.sh into third_party/src (git) and third_party/dl
# (tarballs, SHA-256 checked). Format: name kind url commit-or-sha256
#
# moonlight-embedded is used only for libgamestream/ (pairing, app list,
# launch/quit). Its own submodule pin of moonlight-common-c is e44e4290.
moonlight-embedded git https://github.com/moonlight-stream/moonlight-embedded.git 33142e58ebd576085a076f4ce24881d20b3c4ef5
moonlight-common-c git https://github.com/moonlight-stream/moonlight-common-c.git e44e4290ed19de4812dad0ac11211832598a6a34
enet git https://github.com/cgutman/enet.git aca87840b57f045a1f7f9299e4b1b9b8e2a5e2f1
nanors git https://github.com/sleepybishop/nanors.git a9b1636f9c98dbfdd0daeaf6982ccd24d1c30f29
# OpenSSL 3.5 LTS: curl 8.18+ no longer supports OpenSSL 1.1.1 (Debian
# bullseye's). Checksum matches openssl.org and the GitHub release.
openssl tar https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz 603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a
# Checksum from https://curl.se/info.
curl tar https://curl.se/download/curl-8.23.0.tar.gz e3de77cfa6367083c776a26647fc9f633b538c06c3baa73d931a252ac8f72b49
